<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Boardroom Business School | Registro</title>

  <!-- Bootstrap e Iconos -->
  <link href="vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/fontawesome.css">
  <link rel="stylesheet" href="assets/css/templatemo-edu-meeting.css">
  <link rel="stylesheet" href="assets/css/material-kit.min.css" id="pagestyle" />
  <link rel="stylesheet" type="text/css"
    href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900" />
</head>

<body class="bg-light">
  <div id="top"></div>

  <!-- Header Area -->
  <header class="header-area header-sticky">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <nav class="main-nav">
            <a href="index.html" class="logo">
              <img src="assets/images/logo/boardroom-horizontal_175x75.webp" alt="Boardroom Logo">
            </a>
            <ul class="nav">
              <li><a href="index.html" class="active">Inicio</a></li>
              <li><a href="contacto.html">Contacto</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </header>

  <section class="user-page header-text">
    <div class="container">
      <div class="row">
        <div class="col-lg-12">
          <h6>PORTAL EJECUTIVO</h6>
          <h2>ACCESO Y REGISTRO DE USUARIOS</h2>
        </div>
      </div>
    </div>
  </section>

  <section class="meetings-page">
    <div class="container bg-white rounded-top-4 pt-5 pb-5">
      <div class="row justify-content-center">

        <!-- Formulario -->
        <div class="col-md-6 d-flex justify-content-center align-items-center">
          <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5"
            style="width: 100%; max-width: 420px; background-color: #ffffff;">
            <div class="text-center pb-3">
              <h2 class="fw-bold text-dark h4 mb-2">Registro</h2>
            </div>

            <form id="registroForm">
              <div class="mb-3">
                <label class="form-label text-dark fw-bold small">Nombre</label>
                <input type="text" class="form-control text-dark px-3" id="inputNombre" placeholder="Nombre" required
                  style="border: 1px solid #ccc !important;">
              </div>

              <div class="mb-3">
                <label class="form-label text-dark fw-bold small">Apellido</label>
                <input type="text" class="form-control text-dark px-3" id="inputApellido" placeholder="Apellido"
                  required style="border: 1px solid #ccc !important;">
              </div>

              <div class="mb-3">
                <label class="form-label text-dark fw-bold small">Correo electrónico</label>
                <input type="email" class="form-control text-dark px-3" id="inputEmail"
                  placeholder="ejemplo@boardroom.com" required style="border: 1px solid #ccc !important;">
              </div>

              <div class="mb-3">
                <label class="form-label text-dark fw-bold small">Contraseña</label>
                <input type="password" class="form-control text-dark px-3" id="inputPassword"
                  placeholder="Mínimo 6 caracteres" required minlength="6" style="border: 1px solid #ccc !important;">
              </div>

              <div class="mb-4">
                <label class="form-label text-dark fw-bold small">Confirmar Contraseña</label>
                <!-- CORREGIDO: Llamada a la función checkPasswords sin caracteres especiales -->
                <input type="password" class="form-control text-dark px-3" id="confirmPassword"
                  placeholder="Repite tu contraseña" required style="border: 1px solid #ccc !important;"
                  oninput="checkPasswords()">
                <div id="errorPassword" class="small mt-1" style="display: none; font-weight: bold;"></div>
              </div>

              <button class="w-100 btn btn-lg btn-primary rounded-3 fw-bold" type="submit" id="btnSubmit">Activar
                Acceso</button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Lógica de control -->
  <script>
    // 1. COMPARACIÓN EN TIEMPO REAL CORREGIDA (Sin caracteres especiales)
    function checkPasswords() {
      const pass1 = document.getElementById('inputPassword').value;
      const pass2 = document.getElementById('confirmPassword').value;
      const errorContainer = document.getElementById('errorPassword');
      const botonSubmit = document.getElementById('btnSubmit');

      if (!pass2) {
        errorContainer.style.display = 'none';
        return;
      }

      errorContainer.style.display = 'block';

      if (pass1 === pass2) {
        errorContainer.textContent = '✓ Las contraseñas coinciden.';
        errorContainer.className = 'text-success small mt-1';
        botonSubmit.disabled = false;
      } else {
        errorContainer.textContent = '✗ Las contraseñas no coinciden.';
        errorContainer.className = 'text-danger small mt-1';
        botonSubmit.disabled = true;
      }
    }

    // 2. ENVÍO DEL FETCH
    document.getElementById('registroForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      const botonSubmit = document.getElementById('btnSubmit');
      const textoOriginal = botonSubmit.textContent;

      botonSubmit.disabled = true;
      botonSubmit.textContent = 'Procesando...';

      const datos = {
        firstname: document.getElementById('inputNombre').value.trim(),
        lastname: document.getElementById('inputApellido').value.trim(),
        email: document.getElementById('inputEmail').value.trim(),
        password: document.getElementById('inputPassword').value
      };

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });

        const contentType = response.headers.get('content-type') || '';
        if (!contentType.includes('application/json')) {
          const textoErrorRaw = await response.text();
          console.error('Respuesta HTML recibida:', textoErrorRaw);
          alert('Error: El servidor web está mal configurado y devolvió una página HTML en lugar de procesar los datos. Revisa el orden de tus rutas en app.js.');
          botonSubmit.disabled = false;
          botonSubmit.textContent = textoOriginal;
          return;
        }

        const resultado = await response.json();

        if (resultado.success) {
          alert('¡Registro exitoso! Bienvenido a Boardroom.');
          window.location.href = 'dashboard.html';
        } else {
          alert('Error: ' + resultado.message);
          botonSubmit.disabled = false;
          botonSubmit.textContent = textoOriginal;
        }
      } catch (error) {
        console.error('Error en fetch:', error);
        alert('Error de conexión con el servidor.');
        botonSubmit.disabled = false;
        botonSubmit.textContent = textoOriginal;
      }
    });
  </script>
</body>

</html>
